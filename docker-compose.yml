version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_news_agent
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
    ports: ["7474:7474", "7687:7687"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on: [postgres, neo4j]
